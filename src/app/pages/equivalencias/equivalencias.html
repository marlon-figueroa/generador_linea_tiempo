<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
  <div>
    <p class="eyebrow mb-1">Equivalencias</p>
    <h1 class="h3">Valor presente, futuro e interés</h1>
    <p class="text-secondary mb-0">
      Deje en cero la incógnita (P o F) para que el motor la despeje según el tipo de interés, la
      capitalización y la serie.
    </p>
  </div>
  <a routerLink="/linea-tiempo" class="btn btn-outline-primary">Abrir diagrama completo</a>
</div>

<div class="row g-4">
  <div class="col-xl-5">
    <div class="panel">
      <app-scenario-form [scenario]="session.scenario()" (changed)="session.update($event)" />
      <button type="button" class="btn btn-primary mt-3" (click)="calculate()">Calcular equivalencias</button>
    </div>
  </div>
  <div class="col-xl-7">
    <app-timeline-board [points]="(output() ?? session.lastOutput())?.points ?? []" />
    <div class="mt-3">
      <app-result-panel [result]="output() ?? session.lastOutput()" />
    </div>
  </div>
</div>
